name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "17 7 * * 6"
  push:
    branches: [master, main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-duckdb

      - name: dbt deps
        run: dbt deps --profiles-dir .

      - name: dbt build (seed + run + test) on DuckDB
        run: dbt build --profiles-dir .

      - name: Export the project's own metadata
        # Reads target/manifest.json, target/run_results.json and the DuckDB
        # file dbt just wrote. Not diffed against the committed CSVs on
        # purpose: they carry build timings, and a timing that reproduced
        # byte-for-byte would mean it was not measured. What this asserts is
        # that the exporter still runs against the manifest dbt produces today.
        run: python exports/build_dbt_metadata.py

  airflow-dag-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Airflow (constrained) + pytest
        run: |
          pip install "apache-airflow==2.10.5" --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
          pip install pytest

      - name: Validate DAG imports and structure
        run: pytest orchestration/airflow/test_dag_integrity.py -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image and run full dbt build inside the container
        run: |
          docker build -t sca-dbt .
          docker run --rm sca-dbt
