name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "17 7 * * 6"
  push:
    branches: [master, main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-duckdb

      - name: dbt deps
        run: dbt deps --profiles-dir .

      - name: dbt build (seed + run + test) on DuckDB
        run: dbt build --profiles-dir .

      # The badge is a claim about this project, and nothing compared the two.
      # In a sibling repository a badge sat 163 tests behind its suite for
      # months because the only guard counted the wrong thing. `dbt ls` is the
      # source of truth for both resource types.
      #
      # The badge number is cut out with sed rather than grepped for digits:
      # a shields URL contains %20 for every space, so a digit-run match reads
      # "154" as 20, 154, 20 and compares the wrong one.
      - name: The README test badge must match what dbt parses
        run: |
          data=$(dbt ls --profiles-dir . --resource-type test | grep -c 'supply_chain_analytics')
          unit=$(dbt ls --profiles-dir . --resource-type unit_test | grep -c 'supply_chain_analytics')
          total=$((data + unit))
          claimed=$(grep -oE 'dbt%20tests-[0-9]+%20across' README.md | head -1             | sed -E 's|dbt%20tests-||; s|%20across||')
          echo "dbt lists: ${data} data + ${unit} unit = ${total}   README badge: ${claimed:-<none>}"
          if [ -z "$claimed" ]; then
            echo "::error::no dbt test badge found in README.md"; exit 1
          fi
          if [ "$total" != "$claimed" ]; then
            echo "::error::README badge says $claimed, dbt lists $total"; exit 1
          fi

      - name: Export the project's own metadata
        # Reads target/manifest.json, target/run_results.json and the DuckDB
        # file dbt just wrote. Not diffed against the committed CSVs on
        # purpose: they carry build timings, and a timing that reproduced
        # byte-for-byte would mean it was not measured. What this asserts is
        # that the exporter still runs against the manifest dbt produces today.
        run: python exports/build_dbt_metadata.py

  airflow-dag-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Airflow (constrained) + pytest
        run: |
          pip install "apache-airflow==2.10.5" --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
          pip install pytest

      - name: Validate DAG imports and structure
        run: pytest orchestration/airflow/test_dag_integrity.py orchestration/airflow/test_orchestration_claims.py -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image and run full dbt build inside the container
        run: |
          docker build -t sca-dbt .
          docker run --rm sca-dbt
